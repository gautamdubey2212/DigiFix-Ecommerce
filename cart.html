</div>



<!-- JAVASCRIPT -->
<script>


/* LOAD CART FROM LOCAL STORAGE */
let cart =
    JSON.parse(localStorage.getItem("cart")) || [];



/* SAVE CART */
function saveCart(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}



/* RENDER CART */
function renderCart(){

    const cartContainer =
        document.getElementById("cart-items");

    cartContainer.innerHTML = "";


    /* EMPTY CART */
    if(cart.length === 0){

        cartContainer.innerHTML = `

        <div class="card border-0 shadow rounded-4 p-5 text-center">

            <h3 class="fw-bold">

                Your Cart is Empty

            </h3>

            <p class="text-muted">

                Add software products to continue shopping.

            </p>

        </div>

        `;

        updateSummary();

        return;
    }



    /* SHOW PRODUCTS */
    cart.forEach((item,index)=>{

        cartContainer.innerHTML += `

        <div class="card shadow cart-card p-4 mb-4">

            <div class="row align-items-center">

                <div class="col-md-3">

                    <img src="${item.image}"
                         class="product-img">

                </div>

                <div class="col-md-5">

                    <h4 class="fw-bold">

                        ${item.name}

                    </h4>

                    <p class="text-muted mb-0">

                        Premium Genuine Software License

                    </p>

                </div>

                <div class="col-md-2 text-center">

                    <div class="d-flex justify-content-center align-items-center gap-2">

                        <button class="btn btn-outline-dark qty-btn"
                                onclick="decreaseQty(${index})">

                            -

                        </button>

                        <span class="fw-bold">

                            ${item.quantity}

                        </span>

                        <button class="btn btn-outline-dark qty-btn"
                                onclick="increaseQty(${index})">

                            +

                        </button>

                    </div>

                </div>

                <div class="col-md-2 text-end">

                    <h5 class="fw-bold text-primary">

                        ₹${(item.price * item.quantity).toLocaleString()}

                    </h5>

                    <button class="btn btn-danger btn-sm rounded-pill mt-2"
                            onclick="removeItem(${index})">

                        Remove

                    </button>

                </div>

            </div>

        </div>

        `;

    });

    updateSummary();

}



/* UPDATE SUMMARY */
function updateSummary(){

    let totalItems = 0;

    let subtotal = 0;


    cart.forEach(item=>{

        totalItems += item.quantity;

        subtotal += item.price * item.quantity;

    });


    let discount = subtotal >= 5000
        ? 1000
        : 0;


    let gst =
        (subtotal - discount) * 0.18;


    let grandTotal =
        (subtotal - discount) + gst;



    /* TOTAL ITEMS */
    document.getElementById("items-count").innerText =
        totalItems;


    /* SUBTOTAL */
    document.getElementById("subtotal").innerText =
        `₹${subtotal.toLocaleString()}`;


    /* DISCOUNT */
    document.getElementById("discount").innerText =
        `- ₹${discount.toLocaleString()}`;


    /* GST */
    document.getElementById("gst").innerText =
        `₹${gst.toLocaleString(undefined,{
            maximumFractionDigits:0
        })}`;


    /* GRAND TOTAL */
    document.getElementById("grand-total").innerText =
        `₹${grandTotal.toLocaleString(undefined,{
            maximumFractionDigits:0
        })}`;


    /* SAVING TEXT */
    document.getElementById("saving-text").innerText =
        `🎉 You saved ₹${discount.toLocaleString()} on this order`;

}



/* INCREASE QUANTITY */
function increaseQty(index){

    cart[index].quantity++;

    saveCart();

    renderCart();

}



/* DECREASE QUANTITY */
function decreaseQty(index){

    if(cart[index].quantity > 1){

        cart[index].quantity--;

    }

    saveCart();

    renderCart();

}



/* REMOVE PRODUCT */
function removeItem(index){

    cart.splice(index,1);

    saveCart();

    renderCart();

}



/* INITIAL LOAD */
renderCart();

</script>

</body>
